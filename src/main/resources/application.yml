spring:
  application:
    name: despacho

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
      session-token: ${AWS_SESSION_TOKEN}
    region:
      static: us-east-1
    s3:
      enabled: true

app:
  s3:
    bucket: ${S3_BUCKET_NAME:mi-bucket-despacho}
  efs:
    path: /app/efs

server:
  port: 8080